<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebVR Video 360 Degree</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      #play-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 12px 24px;
        background-color: #ff4757;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <button id="play-btn">Bấm để xem Video 360°</button>
    
    <a-scene vr-mode-ui="enabled: true">
      
      <a-assets>
        <video id="video-360" 
               src="./7900775667437.mp4" 
               autoplay="true" 
               loop="true" 
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>
      
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
      
      <a-entity camera look-controls></a-entity>
      
    </a-scene>

    <script>
      const button = document.getElementById('play-btn');
      const video = document.getElementById('video-360');

      button.addEventListener('click', function() {
        video.play();
        button.style.display = 'none';
      });
    </script>
  </body>
</html>
